name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# ci.yml already builds an unsigned Debug app on every push to main and every
# PR, so this workflow only needs to cover the tag-triggered signed release --
# there is no separate non-tag-push case here to add an unsigned smoke build
# for.
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Forks don't inherit these secrets, and a repo that hasn't been set up
      # yet won't have them either -- checking all six up front catches both
      # cases (and a partial configuration) with a clear message, instead of
      # a confusing failure deep inside release.sh after a paid notarization
      # round-trip.
      - name: Verify required secrets are configured
        env:
          SENTINEL_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          SENTINEL_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          SENTINEL_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SENTINEL_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SENTINEL_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SENTINEL_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          [[ -z "$SENTINEL_CERT_P12" ]] && missing+=("DEVELOPER_ID_CERT_P12_BASE64")
          [[ -z "$SENTINEL_CERT_PASSWORD" ]] && missing+=("DEVELOPER_ID_CERT_PASSWORD")
          [[ -z "$SENTINEL_SPARKLE_KEY" ]] && missing+=("SPARKLE_PRIVATE_KEY")
          [[ -z "$SENTINEL_NOTARY_KEY" ]] && missing+=("NOTARY_API_KEY_BASE64")
          [[ -z "$SENTINEL_NOTARY_KEY_ID" ]] && missing+=("NOTARY_API_KEY_ID")
          [[ -z "$SENTINEL_NOTARY_ISSUER_ID" ]] && missing+=("NOTARY_API_ISSUER_ID")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secret(s): ${missing[*]}" >&2
            echo "::error::This usually means the workflow is running on a fork, or the" >&2
            echo "::error::repository secrets described in RELEASING.md have not all" >&2
            echo "::error::been added yet. See RELEASING.md for the full list and how" >&2
            echo "::error::to produce each one." >&2
            exit 1
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Core tests
        run: swift test --package-path CopyCore

      - name: Install xcodegen
        run: brew install xcodegen

      # Import the Developer ID Application cert+key into a fresh, disposable
      # keychain rather than the runner's login keychain, and clear it out in
      # the "Clean up signing credentials" step below regardless of outcome.
      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/copy-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 -- word splitting is intentional: each
          # existing keychain path becomes its own argument to -s.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle-private-key.txt"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_PATH"
          chmod 600 "$SPARKLE_KEY_PATH"
          echo "SPARKLE_ED_KEY_FILE=$SPARKLE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          {
            echo "NOTARY_API_KEY_PATH=$NOTARY_KEY_PATH"
            echo "NOTARY_API_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_API_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # GITHUB_REF_NAME is a default runner env var (not a `${{ }}` template
      # expression), so expanding it in a shell script here is injection-safe.
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize release
        run: Scripts/release.sh "$VERSION"

      # Idempotent: if a re-run follows a mid-job failure and the release
      # already exists (created by an earlier attempt), skip re-creating it
      # rather than failing on a duplicate.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            "build/Copy-${VERSION}.dmg" \
            "build/Copy-${VERSION}.zip" \
            --title "Copy $VERSION" \
            --notes-file CHANGELOG.md

      # release.sh refreshes docs/appcast.xml in the tag checkout's working
      # tree, but that checkout is detached at the tag -- carry the updated
      # file over to main and commit it there so GitHub Pages serves it.
      - name: Commit updated appcast to main
        run: |
          cp docs/appcast.xml "$RUNNER_TEMP/appcast.xml"

          git fetch origin main
          # -f discards the working-tree changes release.sh made to
          # docs/appcast.xml in this detached-at-tag checkout. A plain
          # `git checkout main` aborts ("local changes would be overwritten")
          # whenever docs/appcast.xml differs between the tag and main, which
          # is the normal case: main carries the PREVIOUS release's appcast
          # commit, and a tag cut before that commit does not. -B pins the
          # branch to origin/main, so this also replaces the `reset --hard`
          # that used to run too late to help.
          git checkout -f -B main origin/main

          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml

          # Point the site's direct-download buttons (data-dmg-download) at this
          # release's DMG so "Download" always fetches the newest signed build.
          sed -i.bak "s|releases/download/v[0-9][0-9.]*/Copy-[0-9][0-9.]*\.dmg|releases/download/${GITHUB_REF_NAME}/Copy-${VERSION}.dmg|g" docs/index.html
          rm -f docs/index.html.bak

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/appcast.xml docs/index.html
          if git diff --cached --quiet; then
            echo "No appcast or download-link changes to commit."
          else
            git commit -m "chore: update appcast + download links for $GITHUB_REF_NAME"
            git push origin main
          fi

      # Runs AFTER the appcast commit on purpose. The appcast is what delivers the
      # update to people who already have Copy installed; the tap only affects new
      # `brew install` runs. If the tap push ever breaks, it must not take the
      # appcast down with it.
      #
      # Pushes with a deploy key rather than github.token, which is scoped to this
      # repo and cannot write to tarikbc/homebrew-tap. The key is write-enabled on
      # the tap only, so it is narrower than a personal access token.
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; skipping the tap bump."
            echo "The tap stays on its previous version until someone bumps it by hand."
            exit 0
          fi

          # The DMG is the cask's artifact; the appcast's enclosure is the zip.
          # Checksum the same file the cask's url resolves to, or brew aborts the
          # install on a mismatch.
          DMG="build/Copy-${VERSION}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "error: $DMG missing; cannot compute the cask checksum." >&2
            exit 1
          fi
          DMG_SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"

          KEY_FILE="$RUNNER_TEMP/tap-deploy-key"
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:tarikbc/homebrew-tap.git "$RUNNER_TEMP/tap"

          # Rewrite only the two lines that change per release, so the cask's
          # livecheck, caveats, and zap block survive untouched.
          CASK="$RUNNER_TEMP/tap/Casks/copy.rb"
          sed -i.bak \
            -e "s|^  version \".*\"$|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${DMG_SHA}\"|" \
            "$CASK"
          rm -f "$CASK.bak"

          grep -q "version \"${VERSION}\"" "$CASK" && grep -q "sha256 \"${DMG_SHA}\"" "$CASK" || {
            echo "error: cask rewrite did not take; leaving the tap untouched." >&2
            exit 1
          }

          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/copy.rb
          if git diff --cached --quiet; then
            echo "Tap already on ${VERSION}."
          else
            git commit -m "copy ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Clean up signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/copy-release-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle-private-key.txt" "$RUNNER_TEMP/notary-api-key.p8" "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/tap-deploy-key"
